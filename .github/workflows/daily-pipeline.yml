name: Daily run

# Runs the pipeline once a day.
on:
  schedule:
    - cron: "0 9 * * *"   # 09:00 UTC daily -- adjust to taste
  workflow_dispatch: {}    # manual "Run workflow" button for testing

permissions:
  contents: write   # to commit the updated ledger/story state back to the repo

concurrency:
  group: brainrotbot-daily
  cancel-in-progress: false   # never cancel a run that might already be mid-upload

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 240   # CPU-only: TTS/alignment/encoding are slower than on a GPU box; raise if runs get truncated
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # Kokoro TTS requires <3.13, same constraint as the conda env locally

      # JS runtime required by yt-dlp.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Speeds up re-runs: pip wheels + downloaded HF/Kokoro/MMS/NLLB model weights.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
          key: brainrotbot-modelcache-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            brainrotbot-modelcache-

      # Caching is split by how often the content actually changes, because the per-repo budget is
      # 10 GB and the model cache above alone is ~4 GB. The old "all of data/ under a per-run key"
      # wrote a fresh 2 GB entry every run, which evicted the model cache every ~3 runs (observed:
      # runs re-downloading Kokoro/MMS/NLLB from scratch). Per-video media is deliberately NOT
      # cached at all -- it's many GB per run and needn't survive: once a video is scheduled it
      # lives on Litterbox and reconcile only needs the story JSON.

      # Background sources + the quantized NLLB model change only when settings.toml does, so key
      # on it: steady state is a cache HIT that saves nothing, keeping the budget flat. The prefix
      # restore-key means editing settings.toml reuses the old cache and re-fetches only what's new.
      - uses: actions/cache@v4
        with:
          path: |
            data/video_cache
            data/translation_cache
          key: brainrotbot-static-${{ hashFiles('config/settings.toml') }}
          restore-keys: |
            brainrotbot-static-

      # Small and genuinely growing (new NCS tracks / Pixabay images each run) -> rolling key.
      - uses: actions/cache@v4
        with:
          path: |
            data/music_cache
            data/thumbnail_cache
          key: brainrotbot-media-${{ github.run_id }}
          restore-keys: |
            brainrotbot-media-

      - name: Install
        run: pip install -e ".[tts,video,music,subtitles,translation,thumbnail]"
        # The "upload" extra is intentionally omitted -- the default provider needs only `requests`.

      - name: Write source cookies
        run: printf '%s' "${{ secrets.YT_COOKIES }}" > config/yt_cookies.txt
        # [video].cookies_file resolves relative to settings.toml's own directory (config/),
        # NOT the repo root -- see Settings.video_cookies_file in config.py. Refresh the
        # secret if downloads start failing; these cookies expire over time.

      - name: Run pipeline
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
        run: python -m brainrotbot.pipeline --top-k 5

      - name: Commit updated ledger + story state
        if: always()   # commit whatever progress was made even if a later story/step failed
        run: |
          git config user.name "brainrotbot"
          git config user.email "actions@users.noreply.github.com"
          [ -f data/ledger.jsonl ] && git add -f data/ledger.jsonl
          [ -d data/stories ] && git add -f data/stories/
          git diff --cached --quiet || git commit -m "chore: update ledger/story state [skip ci]"
          # Rebase onto whatever landed while the run was going (it can take hours), else the push
          # is rejected and a whole run's ledger progress is lost.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push
